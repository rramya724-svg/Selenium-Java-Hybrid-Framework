# ---------------------------- ZEPHYR ESSENTIAL ----------------------
# After the whole suite finishes, every test's final result (after retries)
# is posted to Zephyr Essential. Setup steps: see ZEPHYR_SETUP.md in the project root.
#
# The API token is NOT kept in this file. Set it as an environment variable:
#     ZEPHYR_API_TOKEN=<your token>
# or pass it on the command line: mvn clean test -Dzephyr.api.token=<your token>
zephyr.enabled=true
zephyr.project.key=SCRUM

# Blank = auto-detect. A Zephyr Essential token goes to https://prod-api.zephyr4jiracloud.com/v2;
# Zephyr (formerly Scale) hosts are tried next. Set a URL here only to force one host.
zephyr.base.url=

# Every run updates this existing test cycle ("Automation Testcases").
# Leave blank instead to create a new test cycle for every run.
zephyr.test.cycle.key=SCRUM-R4
zephyr.test.cycle.name.prefix=Automation Run

# Every automated test is linked to its Zephyr test case with @ZephyrTestCase
# (TC_001..TC_010 -> SCRUM-T9..SCRUM-T18). A NEW test without the annotation is
# matched by name "<TEST_CASE_ID> - ..." and, if none exists, created when this is true.
zephyr.auto.create.test.cases=true

# Manual test cases (no automated test), comma separated. They are added to the cycle
# as "Not Executed", ready to be run by hand. In an existing cycle they are added only
# if they are not in it yet, so a result you enter by hand is never overwritten.
zephyr.manual.test.cases=SCRUM-T7,SCRUM-T8

# Optional. Must match an environment defined in Zephyr > Configuration > Environments.
zephyr.environment=

# Zephyr execution statuses (the Zephyr defaults; change only if your project renamed them).
zephyr.status.pass=Pass
zephyr.status.fail=Fail
zephyr.status.skip=Blocked
zephyr.status.not.executed=Not Executed

zephyr.timeout.seconds=30

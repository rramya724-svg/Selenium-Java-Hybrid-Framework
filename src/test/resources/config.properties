# =====================================================================
#  EnterpriseAutomationFramework - Global Configuration
#  Owner : Lalith Kumar BV | Framework Version : 1.0
#  Every value here can be overridden at runtime with -Dkey=value
# =====================================================================

# ---------------------------- BROWSER --------------------------------
browser=chrome
headless=false
maximize=true
window.width=1920
window.height=1080

# ---------------------------- TIMEOUTS (seconds) ---------------------
implicit.wait=10
explicit.wait=20
page.load.timeout=45
script.timeout=30
polling.interval.millis=500

# ---------------------------- ENVIRONMENT ----------------------------
environment=QA
application.name=EnterpriseAutomationFramework
release.version=1.0

# ---------------------------- EXECUTION ------------------------------
retry.count=2
override.reports=true
screenshot.on.success=true
screenshot.on.failure=true

# ---------------------------- PATHS ----------------------------------
report.path=test-output/ExtentReports
screenshot.path=test-output/Screenshots
log.path=logs
excel.path=src/test/resources/testdata.xlsx
excel.sheet.name=TestData

# ---------------------------- EMAIL ----------------------------------
email.enabled=false
email.smtp.host=smtp.gmail.com
email.smtp.port=587
email.smtp.auth=true
email.smtp.starttls=true
email.smtp.ssl=false
email.username=your.address@gmail.com
email.password=your-app-password
email.from=your.address@gmail.com
email.to=qa.team@yourcompany.com
email.cc=
email.subject=Automation Execution Report - EnterpriseAutomationFramework
email.attach.screenshots=true
